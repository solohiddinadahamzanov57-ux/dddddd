name = "dddddd"
main = "src/index.ts"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "none"
run_worker_first = ["/", "/api/*", "/dashboard", "/dashboard/*"]

# Workers AI — reads photos, PDFs and Word docs for the lead importer.
# Uses the free daily allowance; no paid plan needed.
[ai]
binding = "AI"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "driver_desk_db"
database_id = "335aaa55-9d2e-48a8-849d-3309530983f5"
migrations_dir = "migrations"

[vars]
APP_URL = "https://dddddd.muslimsolokhiddin.workers.dev"
# The values below are placeholders so `wrangler types` can see these names.
# They are NOT real secrets. Real values go in .dev.vars (local) or are set
# with `wrangler secret put <NAME>` (deployed) — see README.md.
BETTER_AUTH_SECRET = "dev-only-placeholder-change-me"
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
RESEND_API_KEY = ""
RESEND_FROM_EMAIL = "onboarding@resend.dev"
