name = "driver-desk"
main = "src/index.ts"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "none"
run_worker_first = ["/", "/api/*", "/dashboard", "/dashboard/*"]

[[d1_databases]]
binding = "DB"
database_name = "driver_desk_db"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[vars]
APP_URL = "http://localhost:8787"
# The values below are placeholders so `wrangler types` can see these names.
# They are NOT real secrets. Real values go in .dev.vars (local) or are set
# with `wrangler secret put <NAME>` (deployed) — see README.md.
BETTER_AUTH_SECRET = "dev-only-placeholder-change-me"
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
RESEND_API_KEY = ""
RESEND_FROM_EMAIL = "onboarding@resend.dev"
