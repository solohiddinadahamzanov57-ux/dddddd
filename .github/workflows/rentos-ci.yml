name: RentOS CI

on:
  push:
    branches: [main]
    paths: ["rentos/**", ".github/workflows/rentos-ci.yml"]
  pull_request:
    paths: ["rentos/**", ".github/workflows/rentos-ci.yml"]

defaults:
  run:
    working-directory: rentos

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  PG_TEST_HOST: 127.0.0.1
  PG_TEST_PORT: 5432
  PG_TEST_USER: postgres
  PG_TEST_PASSWORD: postgres

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rentos/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
