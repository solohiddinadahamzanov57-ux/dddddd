<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password – Driver Desk</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="panel auth-card">
      <div class="brand">
        <span class="highway-sign">🚚 Driver Desk</span>
      </div>
      <h2>Set a new password</h2>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <p class="error-text" id="error"></p>
        <button class="btn btn-primary" type="submit" style="width:100%" id="submit-btn">Save new password</button>
      </form>
      <p class="switch-link"><a href="/login.html">Back to log in</a></p>
    </div>
  </div>
  <script src="/js/auth-pages.js"></script>
  <script>
    DriverDeskAuth.wireResetPassword({
      formId: "reset-form",
      submitBtnId: "submit-btn",
      errorId: "error",
    });
  </script>
</body>
</html>
