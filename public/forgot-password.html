<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password – Driver Desk</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="panel auth-card">
      <div class="brand">
        <span class="highway-sign">🚚 Driver Desk</span>
      </div>
      <h2>Forgot your password?</h2>
      <p id="intro">Enter your email and we'll send you a reset link.</p>
      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
        </div>
        <p class="error-text" id="error"></p>
        <button class="btn btn-primary" type="submit" style="width:100%" id="submit-btn">Send reset link</button>
      </form>
      <p class="switch-link"><a href="/login.html">Back to log in</a></p>
    </div>
  </div>
  <script src="/js/auth-pages.js"></script>
  <script>
    DriverDeskAuth.wireForgotPassword({
      formId: "forgot-form",
      submitBtnId: "submit-btn",
      errorId: "error",
      introId: "intro",
    });
  </script>
</body>
</html>
